<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kıble — Her vakit, huzura bir adım">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B2D3B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kıble">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kıble</title>
  <style>
    /* Kök arka plan DÜZ renk olmalı: iOS ana ekran uygulamasında belge
       kutusunun dışında kalan her yer de bu renge boyanır (beyaz şerit yok). */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #1F2937;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Uygulama tüm görünür alanı kaplar; yalnızca alttaki ana ekran çizgisi
       (home indicator) payı bırakılır. iOS ana ekran uygulamasında durum
       çubuğu opak ("black") olduğu için sayfa zaten onun altından başlar. */
    #app {
      position: fixed;
      /* Opak durum çubuğunda 0'dır; eski (saydam) kurulumda durum çubuğu
         yüksekliği kadar aşağıdan başlar, içerik çubuğun altına girmez. */
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      background-color: #0B2D3B;
      touch-action: none;
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="app"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
